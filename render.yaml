# Render Blueprint — provisions the web service AND a Postgres database.
# In Render: New + → Blueprint → connect this repo → Apply.
databases:
  - name: zippi-db
    plan: free
    databaseName: zippi
    user: zippi
    region: singapore

services:
  - type: web
    name: zippi-rental-admin
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "ZIPPI Rental Admin"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Set this in the Render dashboard (Blueprint will prompt for it).
      - key: APP_KEY
        sync: false
      - key: APP_LOCALE
        value: en
      # Database — wired automatically from the Postgres instance above.
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: zippi-db
          property: connectionString
      # Demo-friendly drivers with no extra table dependencies.
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
